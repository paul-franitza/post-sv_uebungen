# Seiteneinstellungen
title: Post SV
subtitle: Volleyball
email: paul.franitza@gmail.com
description: Übungen und fertige Trainings für Tage ohne Trainer
# Für GitHub Pages unter https://paul-franitza.github.io/post-sv_uebungen/ muss baseurl
# "/post-sv_uebungen" sein. Lokal: bundle exec jekyll serve --baseurl "" --livereload
baseurl: "/post-sv_uebungen"
url: "https://paul-franitza.github.io"
author: Paul Franitza

# Social-Links im Footer (Schlüssel = Name des Font-Awesome-Icons)
socials:
  Envelope: paul.franitza@gmail.com
  GitHub: https://github.com/paul-franitza
  Instagram: https://www.instagram.com/paul_fr_/

# Sammlungen: Übungen und fertige Trainings liegen in eigenen Ordnern
collections:
  uebungen:
    output: true
    permalink: /uebungen/:name/
  trainings:
    output: true
    permalink: /trainings/:name/

defaults:
  - scope:
      path: ""
      type: uebungen
    values:
      layout: uebung
  - scope:
      path: ""
      type: trainings
    values:
      layout: training

# Build-Einstellungen
markdown: kramdown
kramdown:
  input: GFM

sass:
  style: compressed

exclude:
  - "*.gemspec"
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - CONTRIBUTING.md
  - README.md
  - vendor
