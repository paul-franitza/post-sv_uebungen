<!DOCTYPE html>
<html lang="de">
{% include head.html %}
<body>
	{% include header.html %}
	<div id="main" class="alt">
		<section id="one">
			<div class="inner">
				<header class="major">
					<h1>{{ page.title }}</h1>
				</header>
				{{ content }}
				{% include filter.html bloecke=true %}
				{% assign liste = site.uebungen | sort: "title" %}
				{% include uebungsliste.html uebungen=liste %}
			</div>
		</section>
	</div>
	{% include footer.html %}
	<script src="{{ "/assets/js/filter.js" | relative_url }}"></script>
</body>
</html>
